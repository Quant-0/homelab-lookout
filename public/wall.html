<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Wall</title>
  <link rel="icon" href="/logo">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/appearance.css">
  <script src="/static/js/look.js"></script>
</head>
<body class="app wall-body">
  <div class="app-bg" aria-hidden="true"></div>
  <main class="wall" id="wall">
    <header class="wall-head">
      <span class="orb" id="orb" aria-hidden="true"></span>
      <div class="wall-state"><h1 id="headline">Loading…</h1><div class="sub" id="wall-sub"></div></div>
      <span class="spacer"></span>
      <div class="wall-tools" id="wall-tools"></div>
      <div class="wall-brand" id="wall-brand"><img src="/logo" alt=""><span id="wall-title"></span></div>
      <div class="clock"><b id="clock-time"></b><span id="clock-date"></span></div>
    </header>
    <div class="wall-edit-bar" id="wall-edit" hidden></div>
    <div class="wall-grid" id="wall-grid"></div>
    <section class="cl-ticker" id="claude-ticker" aria-label="Claude" hidden></section>
    <section class="svc" id="svc" aria-label="Services"></section>
  </main>
  <p class="banner hidden wall-error" id="global-error" role="alert"></p>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/models.js"></script>
  <script src="/static/js/rack.js"></script>
  <script src="/static/js/claude.js"></script>
  <script src="/static/js/climate.js"></script>
  <script src="/static/js/wall.js"></script>
</body>
</html>
