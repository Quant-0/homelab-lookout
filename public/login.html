<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · Homelab Lookout</title>
  <link rel="icon" href="/logo">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/appearance.css">
  <script src="/static/js/look.js"></script>
</head>
<body>
  <div class="app-bg" aria-hidden="true"></div>
  <div class="login-wrap">
    <form class="card login" id="login-form" autocomplete="on">
      <h1><img src="/logo" alt=""> Homelab Lookout</h1>
      <p class="small muted" id="reauth" hidden>This device is remembered for viewing. Enter the password to change settings.</p>
      <label><span>Username</span><input id="username" name="username" autocomplete="username" required autofocus></label>
      <label><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" id="keep"> Keep me signed in on this device (30 days; risky changes still ask for the password)</label>
      <label class="check" id="remember-row"><input type="checkbox" id="remember"> Remember this device for viewing only (30 days, e.g. a wall tablet)</label>
      <button class="primary" type="submit">Sign in</button>
      <button type="button" class="passkey-btn" id="passkey" hidden>Sign in with a passkey</button>
      <p class="small muted" id="passkey-elsewhere" hidden></p>
      <p class="msg error" id="login-error" role="alert"></p>
    </form>
  </div>
  <script src="/static/js/login.js"></script>
</body>
</html>
