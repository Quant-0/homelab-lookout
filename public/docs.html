<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Docs · Homelab</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/appearance.css">
  <script src="/static/js/look.js"></script>
</head>
<body class="app">
  <div class="app-bg" aria-hidden="true"></div>
  <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
  <div class="app-main">
    <header class="topbar">
      <h1 class="page-title">Docs</h1>
      <span class="spacer"></span>
    </header>
    <main class="docs-main">
      <p class="banner hidden" id="global-error" role="alert"></p>
      <div class="docs-layout">
        <aside class="card docs-nav" id="docs-nav" aria-label="Documentation"></aside>
        <article class="card docs-content" id="docs-content"></article>
      </div>
    </main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/rack.js"></script>
  <script src="/static/js/markdown.js"></script>
  <script src="/static/js/docs.js"></script>
</body>
</html>
