<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Homelab</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/appearance.css">
</head>
<body class="app">
  <div class="app-bg" aria-hidden="true"></div>
  <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
  <div class="app-main">
    <header class="topbar">
      <h1 class="page-title">Overview</h1>
      <span class="page-meta" id="updated"></span>
      <span class="spacer"></span>
      <div class="page-actions" id="nav"></div>
    </header>
    <main>
      <p class="banner hidden" id="global-error" role="alert"></p>
      <div class="edit-bar hidden" id="edit-bar" role="toolbar" aria-label="Customize dashboard"></div>
      <p class="empty hidden" id="empty-hint"></p>
      <section class="attention" id="attention" aria-label="Status"></section>
      <div class="dash" id="dash">
        <div class="grid" id="grid"></div>
        <aside class="rack-panel card" id="rack-panel" aria-label="Rack"></aside>
      </div>
    </main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/layout.js"></script>
  <script src="/static/js/rack.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
